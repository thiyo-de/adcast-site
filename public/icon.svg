<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#08090D"/>
    </linearGradient>
    <linearGradient id="neonLip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="45%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="goldDrop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#F43F5E" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#F43F5E" stroke-opacity="0.3" stroke-width="6"/>

  <!-- Seductive Lips Base with Glow -->
  <g filter="url(#neonGlow)">
    <!-- Top Lip (Luscious Cupid's Bow) -->
    <path d="M 120 250 C 150 190, 210 180, 256 210 C 302 180, 362 190, 392 250 C 340 240, 290 255, 256 242 C 222 255, 172 240, 120 250 Z" fill="url(#neonLip)"/>
    <!-- Bottom Lip (Full & Voluptuous) -->
    <path d="M 120 250 C 160 270, 200 340, 256 340 C 312 340, 352 270, 392 250 C 345 285, 295 292, 256 292 C 217 292, 167 285, 120 250 Z" fill="url(#neonLip)"/>
  </g>

  <!-- Glossy Lip Highlights -->
  <path d="M 215 304 C 235 320, 277 320, 297 304 C 285 312, 227 312, 215 304 Z" fill="#FFFFFF" opacity="0.6"/>
  <ellipse cx="256" cy="222" rx="28" ry="6" fill="#FFFFFF" opacity="0.45"/>

  <!-- Sleek Modern Letter 'H' (Intertwined) -->
  <g fill="url(#hGrad)">
    <!-- Left Pillar -->
    <rect x="194" y="152" width="26" height="208" rx="13"/>
    <!-- Right Pillar -->
    <rect x="292" y="152" width="26" height="208" rx="13"/>
    <!-- Center Bar -->
    <rect x="194" y="242" width="124" height="26" rx="8"/>
  </g>

  <!-- Wet / Liquid Gloss Droplets dripping from the H & Lips -->
  <g filter="url(#neonGlow)">
    <!-- Droplet 1 (Center-Left) -->
    <path d="M 207 365 C 200 375, 195 385, 195 394 C 195 407, 201 416, 207 416 C 213 416, 219 407, 219 394 C 219 385, 214 375, 207 365 Z" fill="url(#goldDrop)"/>
    <ellipse cx="205" cy="390" rx="3" ry="5" fill="#FFFFFF" opacity="0.7"/>

    <!-- Droplet 2 (Center-Right Splash) -->
    <path d="M 305 365 C 298 373, 294 380, 294 388 C 294 397, 299 404, 305 404 C 311 404, 316 397, 316 388 C 316 380, 312 373, 305 365 Z" fill="url(#goldDrop)"/>
    <ellipse cx="303" cy="385" rx="2" ry="4" fill="#FFFFFF" opacity="0.7"/>
  </g>
</svg>
