name: HornyLeaks Auto Sync & Health Check

on:
  schedule:
    # Runs automatically every 30 minutes to satisfy source-level cron schedules
    - cron: '*/30 * * * *'
  # Allows 1-click manual trigger anytime from GitHub Actions tab or via Netlify function
  workflow_dispatch:
    inputs:
      source_id:
        description: 'Specific source ID to run (or "all")'
        required: false
        default: 'all'
      correlation_id:
        description: 'Correlation ID from manual trigger'
        required: false
        default: 'manual'

jobs:
  sync-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Sync Engine Dependencies
        run: |
          cd adcast-sync-engine
          npm ci

      - name: Run Video Synchronization Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_VIDEOS_PER_RUN: 15
          INPUT_SOURCE_ID: ${{ github.event.inputs.source_id }}
          INPUT_CORRELATION_ID: ${{ github.event.inputs.correlation_id }}
        run: |
          cd adcast-sync-engine
          node src/scheduler.js --source="${INPUT_SOURCE_ID:-all}" --correlation="${INPUT_CORRELATION_ID:-cron}"

      - name: Run Stream Health Audit (Auto Soft-Delete Dead Streams)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd adcast-sync-engine
          npm run health-check
