    <script type="module">
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        if (import.meta.env.DEV) {
          // An old worker can cache Vite modules under unchanged /src URLs.
          // Remove only this app's registration/caches, then release its controller.
          const workerUrl = new URL('/sw.js', location.origin).href;
          const controlled = navigator.serviceWorker.controller?.scriptURL === workerUrl;
          try {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.filter(registration =>
              [registration.active, registration.waiting, registration.installing]
                .some(worker => worker?.scriptURL === workerUrl)
            ).map(registration => registration.unregister()));
            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(keys.filter(key => key.startsWith('adcast-cache-')).map(key => caches.delete(key)));
            }
            if (controlled) location.reload();
          } catch (error) {
            console.warn('Could not clear the development worker:', error);
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
          });
        }
      }
    </script>
